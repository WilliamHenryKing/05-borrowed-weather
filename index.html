<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BORROWED WEATHER</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="A cosy hiking adventure carrying weather in a jar" />
    <style>
      /* Arrival veil: shown until worldReady() in src/loader.ts lifts it. Damp stone, moss and a misted jar. */
      #arrival { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 16px; color: #f1e9d6; font: 600 12px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.24em; text-transform: uppercase; background: radial-gradient(ellipse at 50% 35%, #56685a 0%, #2b3826 45%, #141a12 100%); transition: opacity 0.8s ease, visibility 0.8s; }
      #arrival::before { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(circle at 30% 70%, rgb(255 255 255 / 0.025) 0 2px, transparent 2px 7px); pointer-events: none; }
      #arrival.is-done { opacity: 0; visibility: hidden; }
      #arrival .jar { width: 54px; height: 66px; }
      #arrival .jar .mist { animation: arrival-mist 2.4s ease-in-out infinite alternate; }
      #arrival .title { font: italic 400 26px/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: 0.04em; text-transform: none; }
      #arrival .bar { width: 140px; height: 2px; background: #f1e9d622; overflow: hidden; border-radius: 2px; }
      #arrival .bar i { display: block; height: 100%; width: 40%; background: #ffb45e; animation: arrival-slide 1.4s ease-in-out infinite; }
      @keyframes arrival-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes arrival-mist { from { transform: translateY(2px); opacity: 0.5; } to { transform: translateY(-3px); opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) { #arrival .bar i, #arrival .jar .mist { animation: none; } #arrival .bar i { width: 100%; } }
    </style>
  </head>
  <body>
    <div id="arrival" role="status" aria-live="polite">
      <svg class="jar" viewBox="0 0 46 56" aria-hidden="true"><rect x="11" y="3" width="24" height="7" rx="2" fill="#b58a45"/><path d="M13 10h20v4c5 2 7 6 7 11v21c0 4-3 7-7 7H13c-4 0-7-3-7-7V25c0-5 2-9 7-11z" fill="rgb(230 242 240 / 0.12)" stroke="#e8f0ee" stroke-width="1.6"/><g class="mist" fill="#dfe6e4"><ellipse cx="18" cy="40" rx="8" ry="4"/><ellipse cx="28" cy="36" rx="9" ry="5"/><ellipse cx="23" cy="45" rx="11" ry="4"/></g><g fill="#fff" opacity=".7"><circle cx="12" cy="22" r="1"/><circle cx="35" cy="28" r=".8"/><circle cx="31" cy="46" r="1.1"/></g></svg>
      <span class="title">Borrowed Weather</span>
      <span class="loading-status">Filling the jar</span>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
