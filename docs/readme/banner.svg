<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
<title id="t">Borrowed Weather</title>
<desc id="d">A glass jar in which fog curls, rain drips and a gust streaks in turn, beside the title, with trail islands drifting in warm haze.</desc>
<style>
.drift{animation:drift 8s ease-in-out infinite}
.drift2{animation:drift 8s ease-in-out -3s infinite}
.drift3{animation:drift 8s ease-in-out -5.5s infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-7px)}}
.fog{animation:showA 8s linear infinite}
.rain{opacity:0;animation:showB 8s linear infinite}
.wind{opacity:0;animation:showC 8s linear infinite}
@keyframes showA{0%,28%{opacity:1}35%,93%{opacity:0}100%{opacity:1}}
@keyframes showB{0%,28%{opacity:0}35%,61%{opacity:1}68%,100%{opacity:0}}
@keyframes showC{0%,61%{opacity:0}68%,93%{opacity:1}100%{opacity:0}}
.curl{transform-origin:260px 232px;animation:curl 8s linear infinite}
@keyframes curl{to{transform:rotate(360deg)}}
.drop{animation:drop 1s ease-in infinite}
.drop:nth-child(2){animation-delay:-.25s}.drop:nth-child(3){animation-delay:-.5s}.drop:nth-child(4){animation-delay:-.75s}.drop:nth-child(5){animation-delay:-.4s}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(96px);opacity:.15}}
.gust{stroke-dasharray:46 90;animation:gust 1.6s linear infinite}
.gust:nth-child(2){animation-delay:-.5s}.gust:nth-child(3){animation-delay:-1.1s}
@keyframes gust{to{stroke-dashoffset:-136}}
.haze{animation:haze 8s ease-in-out infinite}
@keyframes haze{0%,100%{opacity:.55}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fog{opacity:1}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f98a2"/><stop offset=".55" stop-color="#d7d2bd"/><stop offset="1" stop-color="#b9c4b8"/></linearGradient>
<radialGradient id="sun" cx=".78" cy=".62" r=".5"><stop offset="0" stop-color="#ffe2b0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffc98a" stop-opacity=".45"/><stop offset="1" stop-color="#ffc98a" stop-opacity="0"/></radialGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4332"/><stop offset=".6" stop-color="#4f5553"/><stop offset="1" stop-color="#3a2c22" stop-opacity=".6"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".35" stop-color="#e6f2f0" stop-opacity=".1"/><stop offset=".8" stop-color="#e6f2f0" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="jar"><path d="M206 128h108v14c26 10 38 30 38 56v108c0 22-16 36-38 36H206c-22 0-38-14-38-36V198c0-26 12-46 38-56z"/></clipPath>
<g id="isle"><ellipse cx="0" cy="0" rx="70" ry="13" fill="#6f8a45"/><path d="M-70 0c20 10 45 12 70 12s50-2 70-12c-6 30-30 60-60 78-8 5-14 5-20 0C-40 60-64 30-70 0z" fill="url(#rock)"/><path d="M-60 -2c4-8 10-6 12-14m20 12c2-10 8-10 8-18m34 18c3-7 9-7 10-15" stroke="#8a9a4e" stroke-width="3" fill="none"/></g>
</defs>
<rect width="1280" height="360" fill="url(#sky)"/>
<rect width="1280" height="360" fill="url(#sun)"/>
<g opacity=".5" class="drift3"><use href="#isle" transform="translate(1180 120) scale(.55)"/></g>
<g opacity=".45" class="drift2"><use href="#isle" transform="translate(560 70) scale(.45)"/></g>
<g opacity=".7" class="drift"><use href="#isle" transform="translate(1040 250) scale(.9)"/></g>
<g opacity=".6" class="drift3"><use href="#isle" transform="translate(80 300) scale(.8)"/></g>
<g class="haze" fill="#f4efe4"><ellipse cx="300" cy="330" rx="420" ry="36"/><ellipse cx="1000" cy="345" rx="380" ry="30"/></g>
<ellipse cx="260" cy="350" rx="120" ry="12" fill="#2b3826" opacity=".25"/>
<g clip-path="url(#jar)">
<rect x="160" y="120" width="200" height="230" fill="#e8f2f0" opacity=".12"/>
<g class="fog"><g class="curl" fill="#f7f9f8" filter="url(#soft)"><ellipse cx="222" cy="250" rx="58" ry="30" opacity=".9"/><ellipse cx="296" cy="226" rx="58" ry="32" opacity=".8"/><ellipse cx="258" cy="298" rx="84" ry="34" opacity=".95"/><ellipse cx="262" cy="186" rx="44" ry="20" opacity=".6"/></g></g>
<g class="rain" fill="#8fc0dc"><rect x="160" y="304" width="200" height="50" opacity=".9"/><g><path class="drop" d="M208 170q13 20 0 30q-13-10 0-30z"/><path class="drop" d="M240 160q13 20 0 30q-13-10 0-30z"/><path class="drop" d="M272 176q13 20 0 30q-13-10 0-30z"/><path class="drop" d="M304 164q13 20 0 30q-13-10 0-30z"/><path class="drop" d="M322 184q13 20 0 30q-13-10 0-30z"/></g></g>
<g class="wind" fill="none" stroke="#f6e3a0" stroke-width="10" stroke-linecap="round"><path class="gust" d="M170 200q45-26 90 0t90 0"/><path class="gust" d="M170 252q45 26 90 0t90 0"/><path class="gust" d="M170 304q45-26 90 0t90 0"/></g>
</g>
<path d="M206 128h108v14c26 10 38 30 38 56v108c0 22-16 36-38 36H206c-22 0-38-14-38-36V198c0-26 12-46 38-56z" fill="url(#glass)" stroke="#eef4f2" stroke-width="5"/>
<rect x="198" y="96" width="124" height="34" rx="8" fill="#b58a45"/><rect x="198" y="96" width="124" height="10" rx="5" fill="#d9a766"/>
<g fill="#fff" opacity=".75"><circle cx="190" cy="200" r="4"/><circle cx="336" cy="222" r="3"/><circle cx="322" cy="300" r="4.5"/><circle cx="186" cy="310" r="3"/><circle cx="214" cy="172" r="2.5"/></g>
<text x="420" y="178" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="84" font-style="italic" fill="#2b3826">Borrowed Weather</text>
<text x="424" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="26" fill="#3b2e22">A cosy hiking puzzle with a jar full of weather.</text>
<text x="424" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" letter-spacing="4" fill="#6b4a1f">TAKE FOG · CARRY RAIN · RELEASE WIND</text>
</svg>
